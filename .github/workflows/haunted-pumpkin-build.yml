name: Build Haunted Pumpkin ESP32
on:
  workflow_dispatch:
  push:
    paths:
      - 'haunted-pumpkin/**'
      - '.github/workflows/haunted-pumpkin-build.yml'

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and esptool
        run: python -m pip install "platformio==6.1.18" "esptool==5.1.0"
      - name: Test Halloween lighting effects
        run: |
          g++ -std=c++17 -Ihaunted-pumpkin/tests/stubs -Ihaunted-pumpkin/include \
            haunted-pumpkin/tests/test_effects.cpp -o /tmp/pumpkin-effects
          /tmp/pumpkin-effects
      - name: Compile firmware for Ideaspark ESP32
        run: pio run -d haunted-pumpkin -e ideaspark-esp32
      - name: Assemble complete ESP32 flash image
        run: |
          set -eu
          OUT=haunted-pumpkin/.pio/build/ideaspark-esp32
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          BOOT_APP=$(find "$FRAMEWORK" -name boot_app0.bin -print -quit)
          BOOTLOADER="$OUT/bootloader.bin"
          if [ ! -f "$BOOTLOADER" ]; then
            BOOTLOADER=$(find "$FRAMEWORK" -name bootloader_dio_40m.bin -print -quit)
          fi
          test -n "$BOOT_APP" && test -f "$BOOT_APP"
          test -n "$BOOTLOADER" && test -f "$BOOTLOADER"
          python -m esptool --chip esp32 merge-bin \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            -o "$OUT/pumpkin-fx-full-flash.bin" \
            0x1000 "$BOOTLOADER" \
            0x8000 "$OUT/partitions.bin" \
            0xe000 "$BOOT_APP" \
            0x10000 "$OUT/firmware.bin"
      - name: Upload complete first-flash image
        uses: actions/upload-artifact@v4
        with:
          name: haunted-pumpkin-full-flash
          path: haunted-pumpkin/.pio/build/ideaspark-esp32/pumpkin-fx-full-flash.bin
          if-no-files-found: error
      - name: Upload application-only firmware
        uses: actions/upload-artifact@v4
        with:
          name: haunted-pumpkin-app-bin
          path: haunted-pumpkin/.pio/build/ideaspark-esp32/firmware.bin
          if-no-files-found: error
      - name: Publish direct-download firmware for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pumpkin-fx-latest"
          OUT="haunted-pumpkin/.pio/build/ideaspark-esp32"
          IMAGE="$OUT/pumpkin-fx-full-flash.bin"
          APP="$OUT/firmware.bin"
          sha256sum "$IMAGE" "$APP" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/FLASH_FROM_ANDROID.txt" <<'TXT'
          HAUNTED PUMPKIN - ANDROID FLASH
          
          1. Download pumpkin-fx-full-flash.bin from the GitHub release.
          2. Connect the Ideaspark ESP32 to Android via USB-C data cable/OTG.
          3. Open ESPFlash on Android and permit USB access.
          4. Select ESP32, the downloaded .bin, and flash address 0x000000.
          5. Press Flash and allow it to complete and verify.
          6. Connect to Pumpkin-FX-Setup, then open http://192.168.77.1/setup
          7. Paste Wi-Fi name/password and Sinric Pro credentials.
          
          NOTE: Firmware is CI-compiled but the board, display,
          LED wiring and Google Home voice mode recognition still
          require real-hardware verification. Disconnect the battery
          supply when flashing from phone USB unless USB power isolation
          has been confirmed.
          TXT
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IMAGE" "$APP" "$OUT/SHA256SUMS.txt" "$OUT/FLASH_FROM_ANDROID.txt" --clobber
          else
            gh release create "$TAG" "$IMAGE" "$APP" "$OUT/SHA256SUMS.txt" "$OUT/FLASH_FROM_ANDROID.txt" \
              --title "Haunted Pumpkin: Android flash firmware" \
              --target "$GITHUB_SHA" \
              --notes "Compiled ESP32 firmware for the Ideaspark Haunted Pumpkin project. Download pumpkin-fx-full-flash.bin for an initial flash at address 0x000000. On-device validation and Google Home voice mode recognition are not yet verified. Configuration is completed on the device over Wi-Fi, no Wi-Fi credentials are embedded in firmware." \
              --prerelease
          fi
